[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jobnotify"
version = "0.1.0"
description = "Send a Telegram alert when a long-running Python job finishes."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "bk" }]
keywords = ["notification", "telegram", "training", "alert", "webhook"]
# Zero runtime dependencies — standard library only.
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
